# Looped Window Attention 600M — pure RWKV-7 replacement for GDN.
# Matched to looped_pure_gdn_600M.yaml except mixer-specific settings.

dump_dir: <DATA_ROOT>/results/looped_pure_rwkv7_600M
name: looped_pure_rwkv7_600M
steps: 255_000
probe_freq: null
seed: 777
grad_acc_steps: 4
gc_collect_freq: 1000

optim:
  lr: 3e-4
  weight_decay: 0.1
  warmup: 10000
  lr_min_ratio: 0.000001
  clip: 1.0

distributed:
  fsdp_type: full_shard
  compile: true
  model_dtype: bf16
  matmul_allow_tf32: false
  selective_activation_checkpointing: false
  tp_size: 1
  spawn_method: spawn

model:
  dim: 1024
  n_layers: 21
  n_heads: 8
  vocab_size: -1
  weight_tying: true
  seed: 42
  head_dim: null
  n_kv_heads: null
  # Parameter-matched against looped_pure_gdn_600M.yaml as closely as the
  # FeedForward multiple_of=256 granularity allows.
  ffn_dim_multiplier: 1.13
  multiple_of: 256
  norm_eps: 1.0e-6
  rope_theta: 10000.0
  init_base_std: null
  init_std_factor: "disabled"
  max_seqlen: 4096

  loop_count: 4
  use_residual: true
  use_block_residual: false

  layer_pattern: "rwkv7"
  rwkv7_head_size: 64
  rwkv7_enable_v_first_mix: true
  rwkv7_backend: "auto"
  rwkv7_chunk_len: 16
  rwkv7_use_l2wrap_ce: false

data:
  root_dir: <DATA_ROOT>/data/
  sources:
    fineweb_edu_100bt: 1.0
  batch_size: 3
  prefetch_size: 1024
  seq_len: 4096
  n_views: 2
  load_async: true
  add_bos: true
  add_eos: true
  tokenizer:
    name: tiktoken
    path: <REPO_ROOT>/tokenizer/original/tokenizer.model

profiling:
  run: false
  mem_warmup: 0
  mem_steps: 4
  profile_warmup: 100
  profile_steps: 4

checkpoint:
  dump:
    every: 25400
    keep: 13
  eval:
    every: 15000000
    keep: -1

logging:
  freq: 10
  wandb:
    project: "looped_transformer"
    name: "looped_pure_rwkv7_600M"

async_eval_gpus: 4
eval:
  generator:
    max_tokens: 4096
    dtype: bf16
    temperature: 1.0
    top_p: 0.95
  harness:
    tasks:
      - hellaswag
      - task: boolq
        dataset_kwargs:
          trust_remote_code: true
      - piqa
      - task: social_iqa
        dataset_kwargs:
          trust_remote_code: true
      - winogrande
      - openbookqa
      - arc_easy
      - arc_challenge
      - race
      - commonsense_qa
      - copa
    log_samples: true
    verbosity: "INFO"
  validation: null
